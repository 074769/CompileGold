name: 'Build (manual/push)'

# Builds on every push to any branch, and can also be triggered manually
# from the Actions tab. Produces downloadable artifacts (x86 and x64) — no GitHub
# release needed, unlike build_release.yml.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK 10.0.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build & publish (x86)
        run: dotnet publish /p:PublishProfile=PublishRelease-x86

      - name: Build & publish (x64)
        run: dotnet publish /p:PublishProfile=PublishRelease-x64

      - name: Zip the builds
        run: |
          Compress-Archive -Path "./CompilePalX/bin/Release/Deploy-x86/*" -DestinationPath "./CompilePal-GoldSrc-SDHLT-x86.zip"
          Compress-Archive -Path "./CompilePalX/bin/Release/Deploy-x64/*" -DestinationPath "./CompilePal-GoldSrc-SDHLT-x64.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CompilePal-GoldSrc-SDHLT
          path: |
            CompilePal-GoldSrc-SDHLT-x86.zip
            CompilePal-GoldSrc-SDHLT-x64.zip
          retention-days: 30
